<html xmlns:th="http://www.thymeleaf.org">

<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Editar Professor</h2>

<form method="post" action="/professores/update">

<input type="hidden" name="codigo" th:value="${professor.codigo}">

<div class="mb-3">
<label>Nome</label>
<input class="form-control" name="nome" th:value="${professor.nome}">
</div>

<div class="mb-3">
<label>Curso</label>
<input class="form-control" name="curso" th:value="${professor.curso}">
</div>

<div class="mb-3">
<label>Matéria</label>
<input class="form-control" name="materiaLecionada" th:value="${professor.materiaLecionada}">
</div>

<button class="btn btn-primary">Salvar</button>

</form>

</div>

</body>
</html>
