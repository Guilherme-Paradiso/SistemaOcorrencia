<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Nova Ocorrência</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">Sistema de Ocorrências</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Início</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/professores">Professores</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/estudantes">Estudantes</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/ocorrencias/nova">Nova Ocorrência</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-5">

    <div class="card">
        <div class="card-body">

            <form method="post" action="/ocorrencias">

                <div class="row">

                    <div class="col-md-3">
                        <label>Data</label>
                        <input type="date" name="data" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>Local</label>
                        <input name="local" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label>Descrição</label>
                        <input name="descricao" class="form-control">
                    </div>

                </div>

                <div class="mt-3">
                    <label>Informação adicional</label>
                    <input name="infoAdicional" class="form-control">
                </div>

                <div class="row mt-3">

                    <div class="col-md-6">
                        <label>Professor</label>
                        <select name="professor.codigo" class="form-select">
                            <option th:each="p : ${professores}"
                                    th:value="${p.codigo}"
                                    th:text="${p.nome}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Estudante</label>
                        <select name="estudante.matricula" class="form-select">
                            <option th:each="e : ${estudantes}"
                                    th:value="${e.matricula}"
                                    th:text="${e.nome}">
                            </option>
                        </select>
                    </div>

                </div>

                <button class="btn btn-primary mt-4">
                    Registrar Ocorrência
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
