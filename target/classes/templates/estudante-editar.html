<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Editar Estudante</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Editar Estudante</h2>

<form method="post" action="/estudantes/update">

<input type="hidden" name="matricula" th:value="${estudante.matricula}">

<div class="mb-3">

<label>Nome</label>

<input class="form-control" name="nome" th:value="${estudante.nome}">

</div>

<div class="mb-3">

<label>Curso</label>

<input class="form-control" name="curso" th:value="${estudante.curso}">

</div>

<div class="mb-3">

<label>Ano de Entrada</label>

<input class="form-control"
name="anoEntrada"
th:value="${estudante.anoEntrada}"
maxlength="4"
pattern="[0-9]{4}"
title="Esse campo não permite a entrada de letras ou de algarismos especiais e de mais de 4 números"
required>

</div>

<button class="btn btn-primary">Salvar</button>

<a href="/estudantes" class="btn btn-secondary">Cancelar</a>

</form>

</div>

</body>
</html>
