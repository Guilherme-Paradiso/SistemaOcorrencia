<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Editar Ocorrência</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Editar Ocorrência</h2>

<form method="post" action="/ocorrencias/update">

<input type="hidden" name="id" th:value="${ocorrencia.id}">

<div class="mb-3">

<label>Data</label>

<input type="date"
name="data"
class="form-control"
th:value="${ocorrencia.data}">

</div>

<div class="mb-3">

<label>Local</label>

<input name="local"
class="form-control"
th:value="${ocorrencia.local}">

</div>

<div class="mb-3">

<label>Descrição</label>

<input name="descricao"
class="form-control"
th:value="${ocorrencia.descricao}">

</div>

<div class="mb-3">

<label>Informação adicional</label>

<input name="infoAdicional"
class="form-control"
th:value="${ocorrencia.infoAdicional}">

</div>

<div class="mb-3">

<label>Professor</label>

<select name="professor.codigo" class="form-select">

<option th:each="p : ${professores}"
th:value="${p.codigo}"
th:text="${p.nome}"
th:selected="${p.codigo == ocorrencia.professor.codigo}">
</option>

</select>

</div>

<div class="mb-3">

<label>Estudante</label>

<select name="estudante.matricula" class="form-select">

<option th:each="e : ${estudantes}"
th:value="${e.matricula}"
th:text="${e.nome}"
th:selected="${e.matricula == ocorrencia.estudante.matricula}">
</option>

</select>

</div>

<button class="btn btn-primary">
Salvar
</button>

<a href="/" class="btn btn-secondary">
Cancelar
</a>

</form>

</div>

</body>

</html>
