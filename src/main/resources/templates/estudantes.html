<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Estudantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="/">Sistema de Ocorrências</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Início</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/professores">Professores</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/estudantes">Estudantes</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/ocorrencias/nova">Nova Ocorrência</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-5">

    <div class="card mb-4">
        <div class="card-body">

            <form method="post">

                <div class="row">

                    <div class="col-md-3">
                        <label>Matrícula</label>
                        <input name="matricula" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>Nome</label>
                        <input name="nome" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>Curso</label>
                        <input name="curso" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label>Ano Entrada</label>
                        <input name="anoEntrada"
class="form-control"
maxlength="4"
pattern="[0-9]{4}"
title="Esse campo não permite a entrada de letras ou de algarismos especiais e de mais de 4 números"
required>
                    </div>

                </div>

                <button class="btn btn-success mt-3">Salvar</button>

            </form>

        </div>
    </div>

    <table class="table table-striped">

        <thead class="table-dark">
        <tr>
            <th>Matrícula</th>
            <th>Nome</th>
            <th>Curso</th>
            <th>Ano</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="e : ${lista}">
            <td th:text="${e.matricula}"></td>
            <td th:text="${e.nome}"></td>
            <td th:text="${e.curso}"></td>
            <td th:text="${e.anoEntrada}"></td>

            <td>

<a th:href="@{/estudantes/editar/{matricula}(matricula=${e.matricula})}"
class="btn btn-warning btn-sm">
Editar
</a>

<a th:href="'/estudantes/delete/'+${e.matricula}"
onclick="return confirm('Deletar algum cadastro pode deletar também as ocorrências referentes à ele')"
class="btn btn-danger btn-sm">
Excluir
</a>

</td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
